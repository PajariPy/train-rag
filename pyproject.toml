[project]
name = "train-rag"
version = "0.1.0"
description = "Agentic RAG over the EnterpriseRAG-Bench company knowledge benchmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.16",
    "datasets>=5.2.0",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "huggingface-hub>=2.3.0",
    "langchain-core>=1.7.0",
    "langchain-deepseek>=1.1.1",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "pgvector>=0.5.1",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "sqlmodel>=0.0.48",
    "umap-learn>=0.5.12",
    "uvicorn>=0.54.0",
    "wandb>=0.31.0",
]

[project.scripts]
train-rag = "train_rag.main:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "ipython>=9.18.1",
    "marimo>=0.25.2",
    "mypy>=2.4.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.per-file-ignores]
# marimo generates untyped, undocumented cell functions; a bare last expression is displayed
"notebooks/*" = ["ANN", "B018", "D", "E501"]
"exploration/question_ambiguity/label.py" = ["ANN", "B018", "D", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bm25s", "Stemmer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
