[project]
name = "herb-rag"
version = "0.1.0"
description = "Agentic RAG over the HERB heterogeneous enterprise benchmark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=2.3.0",
    "langchain-core>=1.7.0",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
]

[project.scripts]
herb-rag-download = "herb_rag.download:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
