services:
  postgres:
    # Postgres 16 with pgvector and pgvectorscale (StreamingDiskANN index) for embeddings.
    image: timescale/timescaledb-ha:pg16
    container_name: train-rag-postgres
    environment:
      POSTGRES_USER: train_rag
      POSTGRES_PASSWORD: train_rag
      POSTGRES_DB: train_rag
    ports:
      - "5434:5432"
    volumes:
      - train-rag-pgdata-vector:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U train_rag"]
      interval: 5s
      retries: 10

volumes:
  train-rag-pgdata-vector:
    # Fixed name: the data was created under the compose project "rag-herb" (the old
    # folder name), so it must not depend on which folder compose runs from.
    name: rag-herb_train-rag-pgdata-vector
