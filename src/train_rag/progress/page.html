<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run progress</title>
<link rel="icon" id="favicon" href="data:,">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --bar: #2f6fdf; --track: #e9ecf3; --ok: #2e8b57; --warn: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --card: #1f1f1f; --ink: #ececea; --muted: #9a9a94; --line: #2e2e2e;
      --bar: #5b8ff0; --track: #2a2f3a; --ok: #5cc28c; --warn: #ef7a6d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 48px auto; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .stage { color: var(--muted); margin: 0 0 24px; }
  .status {
    display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid currentColor; margin-left: 8px; vertical-align: 2px;
  }
  .running { color: var(--bar); } .finished { color: var(--ok); } .stopped { color: var(--warn); }
  .track { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; }
  .fill {
    height: 100%; width: 0; background: var(--bar); border-radius: 7px; transition: width .6s;
  }
  .fill.live {
    background-image: linear-gradient(
      -45deg, rgba(255,255,255,.22) 25%, transparent 25%, transparent 50%,
      rgba(255,255,255,.22) 50%, rgba(255,255,255,.22) 75%, transparent 75%);
    background-size: 28px 28px; animation: move 1s linear infinite;
  }
  .fill.finished { background: var(--ok); } .fill.stopped { background: var(--warn); }
  @keyframes move { from { background-position: 0 0; } to { background-position: 28px 0; } }
  @media (prefers-reduced-motion: reduce) { .fill.live { animation: none; } }
  .note { color: var(--muted); font-size: 14px; margin: -8px 0 20px; min-height: 1.5em; }
  .percent { font-size: 40px; font-weight: 650; margin: 16px 0 20px; font-variant-numeric: tabular-nums; }
  dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; margin: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 2px 0 0; font-size: 20px; font-variant-numeric: tabular-nums; }
  .updated { color: var(--muted); font-size: 13px; margin-top: 24px; }
  @media (max-width: 480px) { dl { grid-template-columns: 1fr; } }
  /* Workflow: steps shown like a CI/CD job (GitHub Actions). */
  .workflow { margin-bottom: 20px; padding: 0; overflow: hidden; }
  .wf-head {
    display: flex; align-items: center; gap: 10px; padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  .wf-head h2 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; min-width: 0; }
  .wf-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .wf-steps { list-style: none; margin: 0; padding: 6px 0; }
  .wf-step { padding: 9px 22px; }
  .wf-row { display: flex; align-items: center; gap: 12px; }
  .wf-name { flex: 1; min-width: 0; }
  .wf-step.queued .wf-name, .wf-step.skipped .wf-name { color: var(--muted); }
  .wf-step.running { background: color-mix(in srgb, var(--bar) 7%, transparent); }
  .wf-dur { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .wf-pct { width: 48px; text-align: right; font-size: 14px; font-weight: 600;
            font-variant-numeric: tabular-nums; color: var(--muted); }
  .wf-pct.running { color: var(--bar); } .wf-pct.success { color: var(--ok); }
  .wf-pct.failed { color: var(--warn); }
  .wf-detail { margin: 6px 0 2px 32px; }
  .wf-detail .mini { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .wf-detail .mini div { height: 100%; background: var(--bar); border-radius: 3px; transition: width .6s; }
  .wf-detail p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .icon { width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center;
          font-size: 12px; font-weight: 700; color: #fff; }
  .icon.queued { border: 2px solid var(--line); }
  .icon.waiting { border: 2px dashed #d4a72c; }
  .icon.running { border: 2px solid var(--track); border-top-color: #d4a72c; animation: spin 1s linear infinite; }
  .icon.success { background: var(--ok); }
  .icon.failed { background: var(--warn); }
  .icon.skipped { border: 2px solid var(--line); color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .icon.running { animation: none; } }
</style>
</head>
<body>
<main>
  <section class="card workflow" id="workflow" hidden>
    <div class="wf-head">
      <h2 id="wf-name"></h2>
      <span class="wf-time" id="wf-time"></span>
    </div>
    <ol class="wf-steps" id="wf-steps"></ol>
  </section>
  <div class="card" id="card">
    <h1 id="pipeline">Waiting for a run…</h1>
    <p class="stage" id="stage">Start one with <code>uv run train-rag ingest</code> or <code>evaluate</code>.</p>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="percent" id="percent">–</div>
    <p class="note" id="note"></p>
    <dl>
      <div><dt id="unit">Items</dt><dd id="items">–</dd></div>
      <div id="data-cell"><dt>Data left</dt><dd id="data">–</dd></div>
      <div><dt>Time elapsed</dt><dd id="elapsed">–</dd></div>
      <div><dt>Time left</dt><dd id="left">–</dd></div>
    </dl>
    <p class="updated" id="updated"></p>
  </div>
</main>
<script>
  // Pages at 14 pt: the corpus averages about 1,700 characters per printed page.
  const CHARS_PER_PAGE = 1700;
  const POLL_MS = 2000;
  const COLORS = { running: "#2f6fdf", finished: "#2e8b57", stopped: "#c0392b" };

  let run = null;      // last state from the server
  let fetchedAt = 0;   // when it arrived, to tick the clocks between polls
  let offline = false;

  const number = (value) => Math.round(value).toLocaleString("en-US");
  const duration = (seconds) => {
    if (seconds === null || !isFinite(seconds)) return "estimating…";
    const total = Math.max(0, Math.round(seconds));
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = total % 60;
    if (hours) return `${hours} h ${minutes} min`;
    return minutes ? `${minutes} min ${secs} s` : `${secs} s`;
  };
  const set = (id, text) => { document.getElementById(id).textContent = text; };

  // Favicon: a ring that fills with the progress, in the colour of the run's status.
  function drawFavicon(share, status) {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 64;
    const context = canvas.getContext("2d");
    context.lineWidth = 12;
    context.strokeStyle = "rgba(128, 128, 128, 0.3)";
    context.beginPath();
    context.arc(32, 32, 24, 0, 2 * Math.PI);
    context.stroke();
    context.strokeStyle = COLORS[status] || COLORS.running;
    context.lineCap = "round";
    context.beginPath();
    context.arc(32, 32, 24, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * Math.max(share, 0.02));
    context.stroke();
    document.getElementById("favicon").href = canvas.toDataURL("image/png");
  }

  function render() {
    if (!run) return;
    const since = (Date.now() - fetchedAt) / 1000;
    const running = run.status === "running";
    const byChars = run.total_chars > 0;
    const share = byChars ? run.done_chars / run.total_chars
      : run.total_items ? run.done_items / run.total_items : 1;
    const charsLeft = run.total_chars - run.done_chars;
    const indexing = running && run.stage.includes("index");

    document.title = `${Math.floor(share * 100)}% · ${run.status} · ${run.pipeline}`;
    set("pipeline", run.pipeline);
    const badge = document.createElement("span");
    badge.className = `status ${run.status}`;
    badge.textContent = run.status;
    document.getElementById("pipeline").append(badge);
    set("stage", running ? `Working on: ${run.stage}` : `Last step: ${run.stage}`);

    const fill = document.getElementById("fill");
    fill.style.width = `${share * 100}%`;
    fill.className = `fill ${running ? "live" : run.status}`;
    set("percent", `${(share * 100).toFixed(1)}%`);
    set("note", indexing
      ? "Building the vector index for this source: the bar moves on when it's done."
      : offline ? "Can't reach the progress server; showing the last known state."
      : run.note);

    set("unit", run.unit.charAt(0).toUpperCase() + run.unit.slice(1));
    set("items", `${number(run.done_items)} / ${number(run.total_items)}`);
    document.getElementById("data-cell").hidden = !byChars;
    set("data", `${number(charsLeft / 1e6)}M chars · ≈${number(charsLeft / CHARS_PER_PAGE)} pages`);
    set("elapsed", duration(run.seconds_elapsed + (running ? since : 0)));
    set("left", run.status === "stopped" ? "stopped"
      : run.seconds_left === null ? "estimating…"
      : duration(run.seconds_left - (running ? since : 0)));
    const ago = (Date.now() - new Date(run.updated_at).getTime()) / 1000;
    set("updated", `Last update from the pipeline ${duration(ago)} ago · live`);
    drawFavicon(share, run.status);
  }

  // Workflow panel: every step of the latest job, like CI/CD steps.
  let flow = null;
  const ICONS = { success: "✓", failed: "✕", skipped: "–", queued: "", running: "" };
  // Every step's percentage: its bar when it has one, 100% when it succeeded, 0% before.
  function stepPercent(step) {
    const run = step.run;
    if (run) {
      const share = run.total_chars ? run.done_chars / run.total_chars
        : run.total_items ? run.done_items / run.total_items : 0;
      return `${Math.floor(share * 100)}%`;
    }
    if (step.status === "success") return "100%";
    if (step.status === "skipped") return "–";
    if (step.status === "running") return "…";
    return "0%";
  }

  function renderWorkflow() {
    const panel = document.getElementById("workflow");
    if (!flow) { panel.hidden = true; return; }
    panel.hidden = false;
    const head = document.getElementById("wf-name");
    head.textContent = flow.workflow;
    const badge = document.createElement("span");
    const label = { running: "running", success: "finished", failed: "stopped" }[flow.status];
    badge.className = `status ${label}`;
    badge.textContent = flow.status;
    head.append(badge);
    const shares = flow.steps.map((step) => {
      if (step.status === "success" || step.status === "skipped") return 1;
      const pct = parseFloat(stepPercent(step));
      return isNaN(pct) ? 0 : pct / 100;
    });
    const overall = shares.reduce((a, b) => a + b, 0) / Math.max(shares.length, 1);
    set("wf-time", `${Math.floor(overall * 100)}% · ${duration(flow.seconds_elapsed)}`);
    const list = document.getElementById("wf-steps");
    list.replaceChildren(...flow.steps.map((step) => {
      const item = document.createElement("li");
      item.className = `wf-step ${step.status}`;
      const row = document.createElement("div");
      row.className = "wf-row";
      const icon = document.createElement("span");
      const waiting = step.status === "queued" && step.note;
      icon.className = `icon ${waiting ? "waiting" : step.status}`;
      icon.textContent = ICONS[step.status];
      const name = document.createElement("span");
      name.className = "wf-name";
      name.textContent = step.name;
      const time = document.createElement("span");
      time.className = "wf-dur";
      time.textContent = step.seconds === null ? "" : duration(step.seconds);
      const percent = document.createElement("span");
      percent.className = `wf-pct ${step.status}`;
      percent.textContent = stepPercent(step);
      row.append(icon, name, time, percent);
      item.append(row);
      const run = step.run;
      if ((step.status === "running" && run) || step.note) {
        const detail = document.createElement("div");
        detail.className = "wf-detail";
        if (step.status === "running" && run) {
          const share = run.total_chars ? run.done_chars / run.total_chars
            : run.total_items ? run.done_items / run.total_items : 0;
          const mini = document.createElement("div");
          mini.className = "mini";
          const fill = document.createElement("div");
          fill.style.width = `${share * 100}%`;
          mini.append(fill);
          detail.append(mini);
          const line = document.createElement("p");
          const left = run.seconds_left === null ? "estimating…" : `${duration(run.seconds_left)} left`;
          line.textContent = `${number(run.done_items)} / ${number(run.total_items)} ${run.unit} · ${(share * 100).toFixed(1)}% · ${left}`;
          detail.append(line);
        }
        if (step.note) {
          const note = document.createElement("p");
          note.textContent = step.note;
          detail.append(note);
        }
        item.append(detail);
      }
      return item;
    }));
  }

  async function poll() {
    try {
      const [state, workflow] = await Promise.all([
        (await fetch("/api/progress", { cache: "no-store" })).json(),
        (await fetch("/api/workflow", { cache: "no-store" })).json(),
      ]);
      offline = false;
      flow = workflow;
      // In a workflow, the big card follows the running step (or the last step with a bar);
      // a run from outside the workflow (an older job) is not shown.
      const current = flow
        ? (flow.steps.find((step) => step.status === "running" && step.run)
           || [...flow.steps].reverse().find((step) => step.run))
        : null;
      const shown = flow ? (current ? current.run : null) : state;
      document.getElementById("card").hidden = flow !== null && shown === null;
      if (shown) { run = shown; fetchedAt = Date.now(); }
    } catch {
      offline = true;
    }
    render();
    renderWorkflow();
  }

  drawFavicon(0, "running");
  poll();
  setInterval(poll, POLL_MS);
  setInterval(render, 1000);
</script>
</body>
</html>
