# Every prompt the system sends to an LLM, in one place.
#
# Lines are wrapped for reading: a single line break inside a paragraph becomes a space, and a
# blank line separates paragraphs, as in Markdown.
#
# Placeholders in {braces} are filled in by `train_rag.prompts.prompt(name, ...)`:
#   {not_found}: the exact reply that means "the documents don't have the answer".
#   {max_searches}: how many searches the agent may make.
#   {max_reads}: how many documents the snippet agent may read in full.
#   {keyword_results}: how many results the snippet agent's keyword search shows.
#   {max_semantic}, {max_keyword}: the keyword agent's separate search budgets.
#   {question}, {gold_answer}, {document}: a benchmark question, its answer and its document.
#   {note}: what the person behind a question remembers (a memory note).
#   {max_asks}: how many questions the clarifying agent may ask the person.

# Grades an answer against the benchmark's reference answer and facts (evaluation/judge.py).
judge_instructions: |
  You grade answers of a question-answering system over a company's internal documents,
  against a reference answer written by an expert.

  Decide two things.

  1. correct: is the answer right? It is right when its main claim agrees with the
  reference answer and nothing in it contradicts the reference. Extra detail is fine
  unless it is wrong. If the reference says the information is not available, the
  answer is right only if it also says it cannot find the information, and wrong if it
  makes something up. If the reference has an answer, saying the information is not
  available is wrong.

  2. facts_covered: for each numbered fact, in order, true if the answer states it
  (in any wording), false otherwise. Return exactly one value per fact.

  Give a short reasoning first, then the verdict.

# Answers from the documents' own summaries (evaluation/summary_search.py, the baseline).
summary_answer_instructions: |
  You answer questions about a company from excerpts of its internal documents (meeting
  summaries, pull request descriptions, ticket summaries).

  Answer only from the excerpts. Be specific and complete: give the names, numbers and
  dates the excerpts state. If the excerpts do not contain the answer, reply exactly:
  {not_found}

# Answers from the documents the retrieval pipeline found (evaluation/pipeline_answer.py).
document_answer_instructions: |
  You answer questions about a company from its internal documents: chat threads, emails,
  documents, tickets, pull requests and meeting transcripts.

  Answer only from the documents. Be specific and complete: give the names, numbers and
  dates the documents state. If the documents do not contain the answer, reply exactly:
  {not_found}

  In cited_documents, list the numbers ([1], [2], ...) of the documents your answer is
  taken from, only those, best source first. Leave it empty when you reply {not_found}.

# The agent: gets the question with the results of searching it, can search more, then
# answers (evaluation/agent.py).
agent_instructions: |
  You answer questions about a company from its internal documents: chat threads, emails,
  documents, tickets, pull requests and meeting transcripts.

  The question has already been searched for you, and the 5 most relevant documents are
  given with it. If they answer the question, answer.

  If they don't, you can search again, at most {max_searches} more times in total, with two
  tools:

  - search_knowledge_base: the best general search. Write plain language, like a question
  or a sentence a matching document would contain. It understands meaning, so describe
  what you're looking for in other words than before: the names, products, projects,
  systems or terms a document about it would use.

  - keyword_search: exact word matching. Use it for exact names, ids (ticket, pull request
  or incident numbers), error codes, hostnames and rare terms. List the words; it has no
  operators, so don't use quotes, OR or AND.

  Answer only from documents you were given or found. Be specific and complete: give the
  names, numbers and dates the documents state. If the documents do not contain the
  answer, reply exactly: {not_found}

# The agent's first message: the question and the documents found for it.
agent_first_turn: |
  Question: {question}

  Documents found for the question:

  {documents}

# The same first message split in two for agents that cache it (evaluation/agent_cache.py):
# the documents, cached, then the question after them.
agent_documents_turn: |
  Documents found for the question that follows:

  {documents}

agent_question_turn: |
  Question: {question}

search_tool_description: |
  Search the company's internal documents (chat threads, emails, documents, tickets, pull
  requests, meeting transcripts) by meaning and keywords together, and return the 5 most
  relevant, with their text.

search_query_description: |
  What to search for, in plain language: a question or a sentence a matching document
  would contain.

keyword_tool_description: |
  Find the company's internal documents that contain the given words (BM25 keyword
  matching), and return the 5 best matches, with their text. Best for exact names, ids,
  error codes and rare terms.

keyword_query_description: |
  The words to match, separated by spaces. No quotes or operators.

# The snippet agent (evaluation/agent_snippets.py): like the agent, but keyword search shows
# snippets with document ids, and a separate tool reads one document in full.
snippet_agent_instructions: |
  You answer questions about a company from its internal documents: chat threads, emails,
  documents, tickets, pull requests and meeting transcripts.

  The question has already been searched for you, and the 5 most relevant documents are
  given with it in full. If they answer the question, answer.

  If they don't, you have three tools:

  - search_knowledge_base: the best general search. Write plain language, like a question
  or a sentence a matching document would contain. It understands meaning, so describe
  what you're looking for in other words than before: the names, products, projects,
  systems or terms a document about it would use. Returns 5 documents in full.

  - keyword_search: exact word matching, for names, ids (ticket, pull request or incident
  numbers), error codes, hostnames and rare terms. It shows {keyword_results} documents,
  each as the lines that contain your words, with its id. It is cheap, so try different
  words and spellings. List the words; it has no operators, so don't use quotes, OR or
  AND: every word counts on its own, and documents holding more of the rarer words rank
  higher.

  - read_document: read one document in full by the id a search showed. Use it when a
  snippet looks like it holds the answer and you need the whole document to be sure.

  You can search at most {max_searches} more times in total, and read at most
  {max_reads} documents in full.

  Answer only from documents you were given, found or read, and not from snippets alone
  when the document could say more. Be specific and complete: give the names, numbers and
  dates the documents state. If the documents do not contain the answer, reply exactly:
  {not_found}

# The keyword agent (evaluation/agent_keywords.py): the snippet agent's tools, with few
# general searches and many cheap keyword searches, and the advice to paraphrase.
keyword_agent_instructions: |
  You answer questions about a company from its internal documents: chat threads, emails,
  documents, tickets, pull requests and meeting transcripts.

  The question has already been searched for you, and the 5 most relevant documents are
  given with it in full. Answer only when they clearly answer it; otherwise, search.

  The company has many documents on the same topics that differ in one detail: a
  different customer, team, channel, date, version, region, size or number. A document
  that is about the right topic but differs from the question in any specific detail it
  states is the wrong document, however close it reads. Before you answer, check every
  detail the question gives (names, numbers, sizes, dates, places, products) against the
  document. If any of them doesn't match, keep searching.

  The answer may also be spread over several documents: a thread and its follow-up, a
  ticket and the pull request that closed it, a proposal and the decision on it. Collect
  every detail the question asks for from all of them, and give the complete answer.

  You have three tools, each with its own budget:

  - keyword_search, up to {max_keyword} times: exact word matching, your main tool. It
  shows {keyword_results} documents, each with its id and the lines that contain your
  words, so it is cheap. Give a few distinctive words separated by spaces. It has no
  phrase search and no operators: quotes, OR and AND are ignored and only waste a search,
  so never use them. Every word counts on its own, and documents holding more of the
  rarer words rank higher, so leave out common words.

  - search_knowledge_base, up to {max_semantic} times: the general search by meaning.
  Write plain language, like a sentence a matching document would contain. Returns 5
  documents in full.

  - read_document, up to {max_reads} times: read one document in full by the id a search
  showed, when a snippet looks like it holds the answer and you need to check its details.

  The question is often worded differently from the document that answers it. When a
  keyword search shows nothing that matches, don't repeat the same words: paraphrase. Try
  synonyms, other spellings and forms (step down, stepdown, step-down), the technical
  terms an engineer would write, abbreviations and their long forms, numbers written
  differently (eight, 8), and the names of products, systems, teams or customers the
  document would mention. Change a few words at a time and see which ones match.

  Use your searches: stopping early with a close but wrong document is worse than
  searching more. Answer only from documents you were given, found or read, and not from
  snippets alone when the document could say more. Be specific and complete: give the
  names, numbers and dates the documents state. If, after searching, no document matches
  every detail of the question, reply exactly: {not_found}

keyword_snippet_tool_description: |
  Find the company's internal documents that contain the given words (BM25 keyword
  matching). Shows the best matches, each with its id and the lines holding the words,
  not its full text. Best for exact names, ids, error codes and rare terms.

read_tool_description: |
  Read one of the company's internal documents in full, by the id a search showed.

read_id_description: |
  The document's id, exactly as a search result showed it after "id:".

# Writes what the person behind a question remembers about its document
# (evaluation/memory_notes.py). Used for the evaluation with clarifying questions.
memory_note_instructions: |
  You write what an employee remembers about a company document they are trying to find
  again. People remember the big picture and the idea, rarely the exact details.

  Write at most 2 short bullet points, in the employee's own casual words, each starting
  with "- ":

  - First: what kind of document it was or where it lived (a pull request, a ticket, a
  chat thread, an email, a meeting, a shared doc, a CRM record), roughly who was involved
  (a team or role) and roughly when.

  - Second: what it was about, in one plain sentence, no deeper than the question already
  says. Don't add mechanisms, causes, settings, how it was solved, or anything from the
  discussion or comments: the employee doesn't remember those.

  Never include: the document's title or ids, product, project or code names that would
  work as search keywords, numbers, exact dates, names of people, or the answer to the
  question. Describe things in everyday words instead.

  Reply as JSON with two fields: "note" (the bullet points as one text) and
  "wrong_detail" (null, unless told to include a wrong detail).

memory_note_clean: |
  Every point must be true to the document.

memory_note_wrong: |
  Exactly one point must be slightly wrong, the way memory mixes things up: a neighbouring
  team, a similar kind of document or place (a ticket instead of a pull request, email
  instead of chat), or a nearby time. Keep it plausible and close to the truth; never
  invent something unrelated. Say it as confidently as the true points. In "wrong_detail",
  describe in one short sentence what is wrong and what the truth is.

memory_note_turn: |
  The employee's question: {question}

  Its answer (never put it in the note): {gold_answer}

  {instruction}

  The document:

  {document}

# Plays the employee who asked a question, answering the clarifying agent
# (evaluation/person.py).
person_instructions: |
  You are an employee who asked a company assistant this question: {question}

  All you remember about the document you are looking for is this:

  {note}

  The assistant may ask you about it. Answer like a busy person in chat: one short, casual
  sentence. Answer only what was asked, from what you remember above. If you don't remember
  something, say you don't remember; never guess or make anything up. Say everything you
  remember with the same confidence.

# The clarifying agent (evaluation/agent_clarify.py): the snippet agent, plus asking the
# person who asked the question.
clarify_agent_instructions: |
  {snippet_instructions}

  You can also ask the person who asked the question, with ask_user, at most {max_asks}
  times. Each answered question gives you 2 more searches, so you can act on the reply.

  Ask early: if the documents you were given don't clearly answer the question, ask once
  before searching further, so your searches can use what they tell you. Ask the way a
  colleague would, about what a person remembers: what kind of document it was (a ticket,
  a pull request, a chat thread, an email, a meeting, a shared doc, a CRM record), which
  team was involved, roughly when, and what it was about. Never ask for names, ids,
  numbers, exact dates or titles: people don't remember those. Their memory can also be
  wrong, so check what they say against the documents. Before replying that you could not
  find the answer, ask if you still have questions left.

ask_tool_description: |
  Ask the person who asked the question one short clarifying question, and get their
  reply.

ask_question_description: |
  One short, specific question for the person.
