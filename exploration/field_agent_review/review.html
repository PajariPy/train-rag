<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field agent review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232d6a8e'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='%23f6f7f5' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='%23f6f7f5' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M11 14h6' stroke='%23f6f7f5' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f7f5;
    --ink: #1f2b33;
    --accent: #2d6a8e;
    --ink-2: rgb(31 43 51 / 0.68);
    --ink-3: rgb(31 43 51 / 0.45);
    --line: rgb(31 43 51 / 0.12);
    --wash: rgb(31 43 51 / 0.04);
    --accent-wash: rgb(45 106 142 / 0.10);
    --serif: "Literata", Georgia, serif;
    --sans: "Public Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 400 16px/1.55 var(--sans);
    font-variant-numeric: tabular-nums;
    display: grid; grid-template-columns: 300px 1fr;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* side list */
  aside {
    border-right: 1px solid var(--line); height: 100vh; overflow-y: auto;
    position: sticky; top: 0; padding: 20px 0;
  }
  aside h1 { font: 600 18px/1.3 var(--sans); margin: 0 20px 4px; }
  aside .hint { margin: 0 20px 14px; color: var(--ink-3); font-size: 13px; }
  .filters { display: flex; gap: 6px; margin: 0 20px 14px; flex-wrap: wrap; }
  .filters button {
    font: 500 13px var(--sans); color: var(--ink-2); background: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  #list { list-style: none; margin: 0; padding: 0; }
  #list button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 9px 20px; font: inherit; color: inherit; display: grid; gap: 1px;
    border-left: 3px solid transparent;
  }
  #list button:hover { background: var(--wash); }
  #list button[aria-current="true"] { background: var(--accent-wash); border-left-color: var(--accent); }
  #list .qid { font-weight: 600; font-size: 14px; }
  #list .meta { font-size: 12.5px; color: var(--ink-3); }
  #list .noted {
    margin-left: 8px; font: 500 11.5px var(--sans); color: var(--accent);
    border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; vertical-align: 1px;
  }

  .note { margin-top: 32px; }
  .note label { display: block; font: 600 14px var(--sans); color: var(--ink-2); margin-bottom: 6px; }
  .note textarea {
    width: 100%; resize: vertical; font: 400 16px/1.55 var(--serif); color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px;
  }
  .note textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .note p { margin: 6px 0 0; }

  /* reading column */
  main { padding: 40px 48px 120px; overflow-x: hidden; }
  .column { max-width: 780px; margin: 0 auto; }
  .judge-line { margin: -14px 0 24px; font-size: 15.5px; color: var(--ink-2); }
  .eyebrow { color: var(--ink-3); font-size: 14px; margin: 0 0 10px; }
  h2.question { font: 500 27px/1.35 var(--serif); margin: 0 0 28px; letter-spacing: -0.005em; }
  h3 { font: 600 17px/1.3 var(--sans); margin: 44px 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--ink-2); }
  .small { font-size: 14px; }

  /* the ruler */
  .ruler { margin: 4px 0 8px; }
  .ruler svg { width: 100%; height: auto; display: block; overflow: visible; }
  .ruler .legend { display: flex; gap: 22px; font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }
  .ruler .legend b { color: var(--ink); font-weight: 600; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 32px; }
  .pair h4 { font: 600 14px var(--sans); color: var(--ink-2); margin: 0 0 6px; }
  .pair .text { font: 400 16.5px/1.6 var(--serif); }
  .verdict { margin-top: 18px; font-size: 14.5px; color: var(--ink-2); }
  .facts { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14.5px; }
  .facts li { padding-left: 22px; position: relative; margin: 3px 0; }
  .facts li::before { content: "–"; position: absolute; left: 4px; color: var(--ink-3); }
  .facts li.hit::before { content: "✓"; color: var(--accent); }

  blockquote {
    margin: 10px 0 0; padding: 14px 18px; background: var(--wash); border-left: 3px solid var(--accent);
    font: 400 15.5px/1.65 var(--serif); white-space: pre-wrap;
  }
  .doc { border-top: 1px solid var(--line); padding: 14px 0; }
  .doc .head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .doc .name { font-weight: 600; }
  .doc.expected .name { color: var(--accent); }
  .tag { font-size: 12.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
  .tag.strong { border-color: var(--accent); color: var(--accent); }
  .doc .rating { margin-top: 6px; font-size: 15px; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 6px; list-style: none; }
  details > summary::before { content: "＋ "; }
  details[open] > summary::before { content: "－ "; }
  pre.full {
    white-space: pre-wrap; font: 400 14.5px/1.6 var(--serif); max-height: 34rem; overflow-y: auto;
    background: #fff; border: 1px solid var(--line); padding: 16px 18px; margin: 10px 0 0;
  }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--ink-2); }
  td.num, th.num { text-align: right; }
  tr.expected td { color: var(--accent); font-weight: 600; }
  tr.text-row td { padding: 0 0 14px; }
  button.read {
    font: 500 13px var(--sans); color: var(--accent); background: none; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px;
  }
  button.read[aria-expanded="true"] { color: var(--paper); background: var(--accent); }

  .search { margin-top: 14px; }
  .search .query { font: 500 15.5px var(--serif); }
  .search .query .tool { font: 500 13px var(--sans); color: var(--ink-3); margin-right: 8px; }
  .empty { color: var(--ink-3); padding: 60px 0; }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    aside { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 24px 16px 80px; }
    .pair { grid-template-columns: 1fr; }
  }
  .ranks { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 8px; font-size: 15px; color: var(--ink-2); }
  .ranks b { font: 600 22px var(--sans); color: var(--ink); display: block; }
  .ranks .hit b { color: var(--accent); }
  .reason { font: 400 15px/1.6 var(--serif); color: var(--ink-2); white-space: pre-wrap; margin: 6px 0 4px; }
  ol.results { margin: 6px 0 0; padding-left: 26px; font-size: 14.5px; }
  ol.results li { margin: 2px 0; }
  ol.results li.expected { color: var(--accent); font-weight: 600; }
  .step { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .step .kind { font-weight: 600; color: var(--ink-2); }
  .step pre { white-space: pre-wrap; font: 400 13.5px/1.55 var(--serif); margin: 6px 0 0; max-height: 26rem; overflow-y: auto; }
</style>
</head>
<body>
<aside>
  <h1>Field agent review</h1>
  <p class="hint">The agent on 125 semantic questions, 24 Nov. Press j and k to move.</p>
  <div class="filters" role="group" aria-label="Show">
    <button data-filter="missed" aria-pressed="true">Missed</button>
    <button data-filter="lower" aria-pressed="false">Found 2–20</button>
    <button data-filter="lost" aria-pressed="false">First search had it</button>
    <button data-filter="first" aria-pressed="false">Found first</button>
    <button data-filter="all" aria-pressed="false">All</button>
  </div>
  <ul id="list"></ul>
</aside>
<main><div class="column" id="case"><p class="empty">Loading the questions…</p></div></main>
<script>
const firstRank = c => typeof c.first_rank === "number" ? c.first_rank : null;
const GROUPS = {
  missed: c => c.outcome === "missed",
  lower: c => c.outcome === "top5" || c.outcome === "top20",
  /* the first search alone had it in its top 5, the agent didn't put it first */
  lost: c => firstRank(c) != null && firstRank(c) <= 5 && c.agent_rank !== 1,
  first: c => c.outcome === "first",
  all: () => true,
};
let cases = [], visible = [], current = null, filter = "missed", notes = {};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const rk = r => r == null ? "—" : typeof r === "number" ? "#" + r : r;

async function init() {
  cases = await (await fetch("/api/cases")).json();
  notes = await (await fetch("/api/notes")).json();
  document.querySelectorAll(".filters button").forEach(b => {
    const n = cases.filter(GROUPS[b.dataset.filter]).length;
    b.textContent += ` ${n}`;
    b.onclick = () => setFilter(b.dataset.filter);
  });
  const fromHash = location.hash.slice(1);
  if (fromHash && !GROUPS[filter](cases.find(c => c.id === fromHash) || {})) filter = "all";
  setFilter(filter, fromHash);
}

function setFilter(name, pick) {
  filter = name;
  document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", b.dataset.filter === name));
  visible = cases.filter(GROUPS[name]);
  document.getElementById("list").innerHTML = visible.map(c => `
    <li><button data-id="${c.id}">
      <span class="qid">${c.id}<span class="noted" ${notes[c.id] ? "" : "hidden"}>noted</span></span>
      <span class="meta">${esc(c.outcome_label)} · ${esc(c.source)}</span>
      <span class="meta">agent ${rk(c.agent_rank)} · first search ${rk(c.first_rank)}</span>
      <span class="meta">${c.searches} searches · ${c.seen ? "a search saw it" : "no search saw it"}</span>
    </button></li>`).join("");
  document.querySelectorAll("#list button").forEach(b => b.onclick = () => show(b.dataset.id));
  const target = visible.find(c => c.id === pick) || visible.find(c => c.id === current) || visible[0];
  if (target) show(target.id); else document.getElementById("case").innerHTML = `<p class="empty">No questions in this group.</p>`;
}

async function show(id) {
  current = id;
  history.replaceState(null, "", "#" + id);
  document.querySelectorAll("#list button").forEach(b => {
    const on = b.dataset.id === id;
    b.setAttribute("aria-current", on);
    if (on) b.scrollIntoView({block: "nearest"});
  });
  const c = await (await fetch("/api/case/" + id)).json();
  if (current !== id) return;
  document.getElementById("case").innerHTML = render(c);
  document.querySelectorAll("details[data-doc]").forEach(d => d.addEventListener("toggle", () => loadDoc(d), {once: true}));
  document.querySelectorAll("button.read").forEach(b => b.onclick = () => toggleRow(b));
  wireNote(id);
  window.scrollTo(0, 0);
}

/* Save the note a second after typing stops, and when the box loses focus. */
function wireNote(id) {
  const box = document.getElementById("note"), status = document.getElementById("note-status");
  let timer = null, sent = box.value;
  const save = async () => {
    clearTimeout(timer);
    if (box.value === sent) return;
    const text = box.value;
    status.textContent = "Saving…";
    try {
      const r = await fetch("/api/note/" + id, {
        method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text}),
      });
      if (!r.ok) throw new Error(r.status);
      const saved = await r.json();
      sent = text;
      if (saved.text) notes[id] = saved; else delete notes[id];
      status.textContent = saved.text ? "Saved" : "Note removed";
      const mark = document.querySelector(`#list button[data-id="${id}"] .noted`);
      if (mark) mark.hidden = !saved.text;
    } catch (err) {
      status.textContent = "Not saved: the server didn't answer. Your text is still here; try again.";
    }
  };
  box.addEventListener("input", () => { status.textContent = "Editing…"; clearTimeout(timer); timer = setTimeout(save, 1000); });
  box.addEventListener("blur", save);
}

async function loadDoc(d) {
  const pre = d.querySelector("pre");
  const r = await fetch("/api/doc/" + encodeURIComponent(d.dataset.doc));
  pre.textContent = r.ok ? (await r.json()).text : "This document isn't loaded.";
}

function readButton(docId) {
  return `<button class="read" data-doc="${esc(docId)}" aria-expanded="false">Read</button>`;
}

/* Open or close a document's text in a row under its table row. */
async function toggleRow(button) {
  const row = button.closest("tr");
  const open = button.getAttribute("aria-expanded") === "true";
  if (open) {
    row.nextElementSibling.remove();
    button.setAttribute("aria-expanded", "false");
    button.textContent = "Read";
    return;
  }
  const textRow = document.createElement("tr");
  textRow.className = "text-row";
  textRow.innerHTML = `<td colspan="${row.children.length}"><pre class="full">Loading…</pre></td>`;
  row.after(textRow);
  button.setAttribute("aria-expanded", "true");
  button.textContent = "Close";
  const r = await fetch("/api/doc/" + encodeURIComponent(button.dataset.doc));
  textRow.querySelector("pre").textContent = r.ok ? (await r.json()).text : "This document isn't loaded.";
}

/* A table of documents: rank, name, tags, a Read button. */
function docTable(c, ids, extra = () => "") {
  const expected = new Set(c.expected), final = new Set(c.final), picks = new Set(c.picks);
  return `<table><thead><tr><th>#</th><th>Document</th><th></th><th></th></tr></thead><tbody>
    ${ids.map((d, i) => `<tr class="${expected.has(d) ? "expected" : ""}"><td>${i + 1}</td>
      <td>${esc(c.names[d] ?? d)}</td>
      <td>${expected.has(d) ? `<span class="tag strong">expected</span> ` : ""}${picks.has(d) ? `<span class="tag">picked</span> ` : ""}${extra(d)}</td>
      <td>${readButton(d)}</td></tr>`).join("")}
  </tbody></table>`;
}

/* One sentence on where the expected document got lost. */
function diagnosis(c) {
  if (c.outcome === "first") return "The agent put the expected document first.";
  if (!c.seen) return "None of the agent's searches had the expected document in its logged top 50, so it never reached the final rerank.";
  const where = `Search ${c.seen_by.join(", ")} had it`;
  if (c.picked.length) return `${where}, and the agent picked it, but the final rerank and check put others ahead.`;
  if (c.expected_score != null) return `${where}; the agent didn't pick it. The final rerank scored it ${c.expected_score.toFixed(3)} against ${c.top_score.toFixed(3)} for the best candidate.`;
  return `${where}, but it wasn't among the ${c.reranked} candidates the final rerank read.`;
}

function searchBlock(c, s, place) {
  const expected = new Set(c.expected);
  const settings = s.tool === "search_fields"
    ? [`profile ${s.profile}`, ...(s.areas.length ? [`areas ${s.areas.join(", ")}`] : []),
       ...(s.sources.length ? [`sources ${s.sources.join(", ")}`] : []),
       ...(s.channels.length ? [`channels ${s.channels.join(", ")}`] : [])].join(" · ")
    : "general search (gte + BM25 with a Gemini keyword rewrite, reranked)";
  return `<div class="search">
    <div class="query"><span class="tool">${place}. ${s.tool === "search_fields" ? "fields" : "documents"}</span>${esc(s.query)}</div>
    <p class="muted small">${esc(settings)} · expected document: ${s.expected_rank ? `#${s.expected_rank}` : `not in the top ${s.logged}`}</p>
    ${s.reason ? `<div class="reason">${esc(s.reason)}</div>` : ""}
    <ol class="results">${s.results.map(d => `<li class="${expected.has(d) ? "expected" : ""}">${esc(c.names[d] ?? d)}</li>`).join("")}</ol>
  </div>`;
}

function traceBlock(trace) {
  return trace.map(step => {
    if (step.kind === "model") {
      const calls = step.tool_calls.map(t => `${t.tool}(${JSON.stringify(t.arguments)})`).join("\n");
      return `<div class="step"><span class="kind">model</span>${step.thoughts ? `<pre>${esc(step.thoughts)}</pre>` : ""}${step.text ? `<pre>${esc(step.text)}</pre>` : ""}<pre>${esc(calls)}</pre></div>`;
    }
    const label = step.kind === "tool" ? `tool · ${step.tool}` : step.kind;
    return `<div class="step"><span class="kind">${esc(label)}</span><pre>${esc(step.output || step.text)}</pre></div>`;
  }).join("");
}

function render(c) {
  const expected = new Set(c.expected);
  const ranks = [["Agent", c.agent_rank], ["First search alone", c.first_rank]];
  let html = `<p class="eyebrow">${c.id} · ${esc(c.source)} · ${esc(c.outcome_label)}</p>
    <h2 class="question">${esc(c.question)}</h2>
    <div class="ranks">${ranks.map(([n, r]) => `<span class="${r === 1 ? "hit" : ""}"><b>${rk(r)}</b>${n}</span>`).join("")}
      <span><b>${c.searches}</b>searches</span><span><b>${c.candidates}</b>candidates</span></div>
    <p>${esc(diagnosis(c))}</p>
    <div class="pair">
      <div><h4>Gold answer</h4><div class="text">${esc(c.gold_answer)}</div></div>
      <div><h4>Expected document</h4>${c.expected.map(d => `<div class="doc expected"><div class="head"><span class="name">${esc(c.names[d] ?? d)}</span></div>
        <details data-doc="${esc(d)}"><summary>Read the full document</summary><pre class="full">Loading…</pre></details></div>`).join("")}</div>
    </div>
    <div class="note">
      <label for="note">Your note on this question</label>
      <textarea id="note" rows="4" placeholder="Why did the agent miss it? What would have found it?">${esc(notes[c.id]?.text)}</textarea>
      <p id="note-status" class="muted small" aria-live="polite">${notes[c.id] ? "Saved " + esc(notes[c.id].updated.replace("T", " ").slice(0, 16)) : "Saves on its own as you type."}</p>
    </div>`;

  html += `<h3>The agent's searches</h3><p class="muted small">Each search's query, why it made it (its thoughts), and the 10 results it was shown. Blue: the expected document.</p>`;
  html += c.searches_detail.length ? c.searches_detail.map((s, i) => searchBlock(c, s, i + 1)).join("") : `<p class="muted">It made no search.</p>`;

  html += `<h3>Its picks and the check</h3>`;
  html += c.picks.length ? docTable(c, c.picks) : `<p class="muted">It picked nothing.</p>`;
  html += c.checks.map((k, i) => `<div class="verdict"><b>Check ${i + 1}: ${esc(k.verdict.replaceAll("_", " "))}.</b> ${esc(k.reasoning)}
    ${k.fits.length ? `<ul class="facts">${k.fits.map(d => `<li class="${expected.has(d) ? "hit" : ""}">fits: ${esc(c.names[d] ?? d)}</li>`).join("")}</ul>` : ""}</div>`).join("")
    || `<p class="muted">No check: it never finished.</p>`;

  html += `<h3>The final ranking (top 20)</h3><p class="muted small">The final 5 after the check, then the other candidates by reranker score.</p>`;
  html += docTable(c, c.ranking, d => c.final.includes(d) ? `<span class="tag">final</span>` : "");

  if (c.baseline.length) {
    html += `<h3>The first search alone (top 20)</h3><p class="muted small">hybrid-ft-union on the plain question: no rewrite, no agent.</p>`;
    html += docTable(c, c.baseline);
  }

  html += `<h3>The whole conversation</h3><details><summary>Show every turn</summary>${traceBlock(c.trace)}</details>`;
  return html;
}

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey) return;
  const i = visible.findIndex(c => c.id === current);
  if (e.key === "j" && i < visible.length - 1) show(visible[i + 1].id);
  if (e.key === "k" && i > 0) show(visible[i - 1].id);
});
init();
</script>
</body>
</html>
